name: Build Applications VS

on:
  push:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Applications/**'
      - '.github/workflows/**'
      - 'Scripts/VisualStudio/**'
  pull_request:
    branches: [ amd-staging, amd-mainline, release/** ]
    paths:
      - 'Applications/**'
      - '.github/workflows/**'
      - 'Scripts/VisualStudio/**'

env:
    PLATFORM_TOOLSET_VERSION: 6.2
    HIP_PATH: C:\Program Files\AMD\ROCm\6.2\
    HIPSDK_INSTALLER_VERSION: 24.Q4

jobs:
    build:
        name: "Build Applications Examples"
        strategy:
          matrix:
            config: [Debug, Release]
        runs-on: windows-latest
        steps:
          - uses: actions/checkout@v4
          - uses: microsoft/setup-msbuild@v2
          - name: Install dependencies
            shell: pwsh
            run: |
                  $ProgressPreference = 'SilentlyContinue'
                  python3 -m pip install rich
                  Write-Host "Downloading GLFW 3.4"
                  Invoke-WebRequest -Uri https://github.com/glfw/glfw/releases/download/3.4/glfw-3.4.bin.WIN64.zip -OutFile glfw-3.4.bin.WIN64.zip
                  Expand-Archive -Path glfw-3.4.bin.WIN64.zip -DestinationPath C:\ -PassThru
                  ls C:\glfw-3.4.bin.WIN64
                  Write-Output "GLFW_DIR=C:\glfw-3.4.bin.WIN64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  Write-Host "Downloading Vulkan SDK 1.4.313.2"
                  Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.4.313.2/windows/vulkansdk-windows-X64-1.4.313.2.exe -OutFile vulkansdk-windows-X64-1.4.313.2.exe
                  Write-Host "Installing Vulkan SDK"
                  Start-Process vulkansdk-windows-X64-1.4.313.2.exe -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -NoNewWindow -Wait
                  
          - name: Check GUID
            shell: pwsh
            run: |
                  python3 Scripts/VisualStudio/check_vs_files.py
                  Write-Host "VULKAN_SDK: $env:VULKAN_SDK"
                  Write-Host "VK_SDK_PATH: $env:VK_SDK_PATH"
                  Write-Host "GLFW_DIR: $env:GLFW_DIR"
          - name: Install HIP SDK
            shell: pwsh
            run: |
                  $PSVersionTable
                  $ProgressPreference = 'SilentlyContinue'
                  Write-Host "Downloading installer https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-${{ env.HIPSDK_INSTALLER_VERSION }}-Win10-Win11-For-HIP.exe"
                  Invoke-WebRequest -Uri https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-${{ env.HIPSDK_INSTALLER_VERSION }}-Win10-Win11-For-HIP.exe -OutFile Setup.exe
                  Write-Host "Installing HIP SDK"
                  Start-Process Setup.exe -ArgumentList '-install','-log',"installer_log.txt" -NoNewWindow -Wait
                  if (Test-Path -Path "${{ env.HIP_PATH }}") {
                      Write-Host "HIP_PATH directory exists: ${{ env.HIP_PATH }}"
                      Write-Host "HIP SDK installed successfully"
                  } else {
                      Write-Host "HIP_PATH directory DOES NOT exist: ${{ env.HIP_PATH }}"
                      Write-Host "HIP SDK installation failed"
                      Exit 1
                  }
                  msbuild -version
          - name: Build ${{ matrix.config }} x64
            shell: pwsh
            run: |
                  Write-Host "Replace toolset $((Get-ChildItem -Recurse -File | Get-Content | Select-String -Pattern 'HIP clang 6\..' | Select-Object -First 1).Matches.Value) with HIP clang ${{ env.PLATFORM_TOOLSET_VERSION }}"
                  Get-ChildItem -Recurse -File | Where-Object { Select-String -Pattern 'HIP clang 6\..' -Path $_ } | ForEach-Object {
                    (Get-Content -Path $_.FullName) -replace 'HIP clang 6\..', "HIP clang ${{ env.PLATFORM_TOOLSET_VERSION }}" | Set-Content -Path $_.FullName
                  }
                  msbuild Scripts\VisualStudio\build.proj -maxCpuCount -detailedSummary -property:"Category=Applications;Configuration=${{ matrix.config }};Platform=x64"
                  Write-Host "msbuild returned: $LastExitCode"
                  Exit $LastExitCode